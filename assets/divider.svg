<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B66DDB" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B66DDB" stop-opacity=".7"/>
      <stop offset="1" stop-color="#B66DDB" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p{transform-box:fill-box;transform-origin:center;animation:p 4.2s ease-in-out infinite}
    @keyframes p{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
    @media (prefers-reduced-motion:reduce){.p{animation:none}}
  </style>
  <line x1="40" y1="12" x2="960" y2="12" stroke="url(#l)" stroke-width="1.2"/>
  <circle cx="500" cy="12" r="3" fill="#B66DDB"/>
  <circle class="p" cx="566" cy="12" r="3.6" fill="#F2A7BE"/>
</svg>
