    <circle cx="626.9" cy="167.2" r="2.6" fill="#C58BE6" opacity="0.67" class="tw tw2"/>
    <circle cx="691.1" cy="166.7" r="5.4" fill="#C58BE6" opacity="0.92"/>
    <circle cx="784.1" cy="247.8" r="3.8" fill="#C58BE6" opacity="0.72"/>
    <circle cx="810.1" cy="250.1" r="3.2" fill="#C58BE6" opacity="0.8" class="tw tw1"/>
    <circle cx="846.1" cy="225.7" r="2.6" fill="#C58BE6" opacity="0.55"/>
    <circle cx="638.3" cy="143.8" r="3.8" fill="#C58BE6" opacity="0.76"/>
    <circle cx="689.4" cy="243.8" r="3.2" fill="#C58BE6" opacity="0.85" class="tw tw0"/>
    <circle cx="720.0" cy="246.3" r="3.2" fill="#C58BE6" opacity="0.5"/>
    <circle cx="815.6" cy="191.0" r="4.6" fill="#C58BE6" opacity="0.73"/>
    <circle cx="842.8" cy="120.4" r="4.6" fill="#C58BE6" opacity="0.63" class="tw tw3"/>
    <circle cx="673.8" cy="259.5" r="4.6" fill="#C58BE6" opacity="0.86"/>
    <circle cx="640.8" cy="85.1" r="3.2" fill="#C58BE6" opacity="0.63"/>

    <!-- the one who stands apart -->
    <circle class="pulse" cx="944" cy="80" r="26" fill="url(#halo)"/>
    <circle cx="944" cy="80" r="6.5" fill="#F7C6D3"/>
    <text class="serif" x="944" y="114" text-anchor="middle" font-size="12.5" font-style="italic" fill="#F7C6D3" opacity=".9">isolated</text>
    <text class="serif" x="944" y="130" text-anchor="middle" font-size="12.5" font-style="italic" fill="#F7C6D3" opacity=".9">in two cuts</text>
  </g>

  <text class="serif" x="64" y="140" font-size="66" font-style="italic" fill="#FBF4F7" letter-spacing="1">Fatma Moussa</text>
  <line x1="68" y1="164" x2="132" y2="164" stroke="#F2B8C6" stroke-width="2" stroke-linecap="round"/>
  <text class="serif" x="66" y="204" font-size="20" fill="#E9D8F3">Engineering student at ISIMM, Tunisia</text>
  <text class="serif" x="66" y="232" font-size="20" fill="#E9D8F3">Machine learning &amp; mobile development</text>
</svg>
