    <circle cx="730.9" cy="121.3" r="3.2" fill="#C58BE6" opacity="0.81"/>
    <circle cx="729.8" cy="164.0" r="5.4" fill="#C58BE6" opacity="0.8"/>
    <circle cx="751.4" cy="112.7" r="3.8" fill="#C58BE6" opacity="0.89" class="tw tw3"/>
    <circle cx="626.9" cy="250.7" r="2.6" fill="#C58BE6" opacity="0.46"/>
    <circle cx="801.9" cy="181.3" r="4.6" fill="#C58BE6" opacity="0.77"/>
    <circle cx="691.7" cy="189.9" r="4.6" fill="#C58BE6" opacity="0.86" class="tw tw2"/>
    <circle cx="707.3" cy="182.2" r="3.8" fill="#C58BE6" opacity="0.76"/>
    <circle cx="855.8" cy="58.7" r="5.4" fill="#C58BE6" opacity="0.72"/>
    <circle cx="727.1" cy="146.4" r="3.2" fill="#C58BE6" opacity="0.88" class="tw tw1"/>
    <circle cx="720.3" cy="203.3" r="2.6" fill="#C58BE6" opacity="0.72"/>
    <circle cx="759.7" cy="192.4" r="3.2" fill="#C58BE6" opacity="0.56"/>
    <circle cx="764.4" cy="129.1" r="3.2" fill="#C58BE6" opacity="0.56" class="tw tw0"/>
    <circle cx="807.3" cy="117.3" r="4.6" fill="#C58BE6" opacity="0.72"/>
