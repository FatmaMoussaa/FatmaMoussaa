    <circle cx="739.9" cy="261.8" r="5.4" fill="#C58BE6" opacity="0.52" class="tw tw3"/>
    <circle cx="670.0" cy="168.6" r="2.6" fill="#C58BE6" opacity="0.91"/>
    <circle cx="729.8" cy="227.7" r="3.2" fill="#C58BE6" opacity="0.76"/>
    <circle cx="835.0" cy="155.7" r="5.4" fill="#C58BE6" opacity="0.62" class="tw tw2"/>
    <circle cx="807.4" cy="137.7" r="3.8" fill="#C58BE6" opacity="0.54"/>
    <circle cx="832.4" cy="174.8" r="4.6" fill="#C58BE6" opacity="0.75"/>
    <circle cx="769.5" cy="164.9" r="5.4" fill="#C58BE6" opacity="0.9" class="tw tw1"/>
    <circle cx="688.7" cy="228.4" r="2.6" fill="#C58BE6" opacity="0.55"/>
    <circle cx="789.4" cy="125.9" r="2.6" fill="#C58BE6" opacity="0.84"/>
    <circle cx="834.3" cy="208.5" r="2.6" fill="#C58BE6" opacity="0.55" class="tw tw0"/>
    <circle cx="735.2" cy="185.7" r="2.6" fill="#C58BE6" opacity="0.5"/>
    <circle cx="756.9" cy="244.9" r="4.6" fill="#C58BE6" opacity="0.89"/>
    <circle cx="762.0" cy="90.0" r="4.6" fill="#C58BE6" opacity="0.52" class="tw tw3"/>
