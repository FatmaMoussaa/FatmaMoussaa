<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Fatma Moussa</title>
  <desc id="d">A cluster of lavender points with one rose point set apart, separated from the others by two cuts, like in an isolation tree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241636"/>
      <stop offset=".55" stop-color="#3F2760"/>
      <stop offset="1" stop-color="#6C4590"/>
    </linearGradient>
    <radialGradient id="glow" cx=".12" cy="1.05" r=".7">
      <stop offset="0" stop-color="#F2B8C6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#F2B8C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F7C6D3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F7C6D3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .tw{animation:tw 5s ease-in-out infinite}
    .tw1{animation-delay:-1.2s} .tw2{animation-delay:-2.6s} .tw3{animation-delay:-3.8s}
    @keyframes tw{0%,100%{opacity:.45}50%{opacity:1}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1.25);opacity:1}}
    .cut{stroke-dasharray:5 7;animation:dash 14s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-96}}
    @media (prefers-reduced-motion:reduce){.tw,.pulse,.cut{animation:none}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>

    <!-- the cuts of an isolation tree -->
    <line class="cut" x1="888" y1="26" x2="888" y2="274" stroke="#F2B8C6" stroke-opacity=".55" stroke-width="1.2"/>
    <line class="cut" x1="888" y1="146" x2="976" y2="146" stroke="#F2B8C6" stroke-opacity=".55" stroke-width="1.2"/>

    <!-- the crowd -->
    <circle cx="669.1" cy="184.6" r="4.6" fill="#C58BE6" opacity="0.8" class="tw tw0"/>
    <circle cx="628.7" cy="195.5" r="3.2" fill="#C58BE6" opacity="0.94"/>
    <circle cx="774.6" cy="222.1" r="5.4" fill="#C58BE6" opacity="0.47"/>
    <circle cx="752.4" cy="142.7" r="3.8" fill="#C58BE6" opacity="0.53" class="tw tw3"/>
    <circle cx="793.5" cy="215.3" r="2.6" fill="#C58BE6" opacity="0.46"/>
    <circle cx="693.6" cy="135.5" r="4.6" fill="#C58BE6" opacity="0.59"/>
    <circle cx="696.3" cy="105.8" r="3.2" fill="#C58BE6" opacity="0.81" class="tw tw2"/>
    <circle cx="661.3" cy="96.4" r="2.6" fill="#C58BE6" opacity="0.57"/>
    <circle cx="782.5" cy="177.3" r="3.2" fill="#C58BE6" opacity="0.7"/>
    <circle cx="657.8" cy="112.1" r="3.8" fill="#C58BE6" opacity="0.7" class="tw tw1"/>
