<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Fatma Moussa</title>
  <desc id="d">Fatma Moussa, engineering student at ISIMM, Tunisia. A cloud of lavender points with one rose point isolated from the rest by two cuts, like in an isolation tree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1030"/>
      <stop offset=".5" stop-color="#352056"/>
      <stop offset="1" stop-color="#6C4590"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2C9DA"/>
    </linearGradient>
    <radialGradient id="glow" cx=".1" cy="1.1" r=".75">
      <stop offset="0" stop-color="#F2B8C6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#F2B8C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".78" cy=".1" r=".5">
      <stop offset="0" stop-color="#B66DDB" stop-opacity=".35"/>
      <stop offset="1" stop-color="#B66DDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F7C6D3" stop-opacity=".6"/>
      <stop offset="1" stop-color="#F7C6D3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" opacity=".07"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .tw{animation:tw 5s ease-in-out infinite}
    .tw1{animation-delay:-1.2s} .tw2{animation-delay:-2.6s} .tw3{animation-delay:-3.8s}
    @keyframes tw{0%,100%{opacity:.4}50%{opacity:1}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1.3);opacity:1}}
    .cut{stroke-dasharray:5 7;animation:dash 14s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-96}}
    @media (prefers-reduced-motion:reduce){.tw,.pulse,.cut{animation:none}}
  </style>
